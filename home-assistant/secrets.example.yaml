# Merge into /config/secrets.yaml locally; never commit the real file.
# Use a real Alarmo user code; quote it to preserve leading zeros.
homekit_alarm_code: "REPLACE_WITH_YOUR_ALARMO_USER_CODE"
# Copy the actual notify entity ID from your Telegram integration.
telegram_notify_entity: "notify.REPLACE_WITH_YOUR_TELEGRAM_CHAT_ENTITY"
